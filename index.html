<!DOCTYPE html>
<html>
<head>
    <title>My Personal Diary</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>My Personal Diary</h1>

    <p>Welcome to my personal diary.</p>

    <h2>Write Your Diary Entry</h2>

    <label>Date:</label>
    <input type="date">

    <br><br>

    <label>Title:</label>
    <input type="text" placeholder="Enter title here...">

    <br><br>

    <label>Your Thoughts:</label>
    <br>
    <textarea rows="10" cols="50" placeholder="Write your thoughts here..."></textarea>

    <br><br>

    <button>Save Entry</button>

</body>
</html>
